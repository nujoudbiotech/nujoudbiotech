
 <svg width="1280" height="250" viewBox="0 0 1280 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- الضوء الأزرق البمشي تحت زي حقها -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- خلفية سوداء فخمة زي حقها بالضبط -->
  <rect width="1280" height="250" fill="#0d1117" rx="6"/>
  <rect x="0.5" y="0.5" width="1279" height="249" fill="none" stroke="#30363d" stroke-opacity="0.4" rx="6"/>

  <!-- الأيقونة الصغيرة على الشمال - شبكة جزيئات زي حقها -->
  <g transform="translate(70,125)" opacity="0.9">
    <circle cx="0" cy="-35" r="5" fill="#58a6ff"/>
    <circle cx="-25" cy="-10" r="4" fill="#a371f7"/>
    <circle cx="25" cy="-5" r="5" fill="#58a6ff"/>
    <circle cx="-15" cy="20" r="4" fill="#39d2c0"/>
    <circle cx="20" cy="25" r="5" fill="#a371f7"/>
    <circle cx="0" cy="0" r="3" fill="#8b949e"/>
    <line x1="0" y1="-35" x2="-25" y2="-10" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="-35" x2="25" y2="-5" stroke="#30363d" stroke-width="1"/>
    <line x1="-25" y1="-10" x2="0" y2="0" stroke="#30363d" stroke-width="1"/>
    <line x1="25" y1="-5" x2="0" y2="0" stroke="#30363d" stroke-width="1"/>
    <line x1="-15" y1="20" x2="0" y2="0" stroke="#30363d" stroke-width="1"/>
    <line x1="20" y1="25" x2="0" y2="0" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- النص - نفس مكان حقها بالضبط -->
  <text x="160" y="135" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica" font-size="48" font-weight="800" fill="white" letter-spacing="-0.5">Nujood</text>
  <text x="162" y="165" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica" font-size="15" font-weight="400" fill="#8b949e">Bioinformatics | Python | Gene Data Science | Gene24 Project</text>

  <!-- الضوء الأزرق المتحرك في الحافة التحت - ده سر جمال حقها! -->
  <g>
    <rect x="-300" y="235" width="300" height="3" fill="url(#scan)" filter="url(#glowBlue)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="1580 0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-300" y="235" width="300" height="15" fill="url(#scan)" opacity="0.15">
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="1580 0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
