<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#ec4899;#a855f7" dur="3s" repeatCount="indefinite"/></stop>
    <stop offset="45%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#3b82f6;#22d3ee" dur="3s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#22c55e"><animate attributeName="stop-color" values="#22c55e;#22d3ee;#22c55e" dur="3s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
</defs>
<rect width="1280" height="360" fill="#0a0e1f"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<g filter="url(#glow)">
  <path d="M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
    <animate attributeName="d" values="M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80; M0,80 Q 160,140 320,80 T 640,80 T 960,80 T 1280,80; M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80" fill="none" stroke="white" stroke-width="1" opacity="0.4">
    <animate attributeName="d" values="M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80; M0,80 Q 160,140 320,80 T 640,80 T 960,80 T 1280,80; M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80" dur="4s" repeatCount="indefinite"/>
  </path>
</g>
<circle r="8" fill="white" filter="url(#bigGlow)" opacity="0.95">
  <animateMotion path="M0,80 Q 160,20 320,80 T 640,80 T 960,80 T 1280,80" dur="4s" repeatCount="indefinite" rotate="auto"/>
  <animate attributeName="opacity" values="1;0.6;1" dur="0.6s" repeatCount="indefinite"/>
</circle>
<g transform="translate(50,180)">
  <text x="0" y="0" font-family="monospace" font-size="54" font-weight="800" fill="#5eead4" filter="url(#glow)">Nujood.biotech</text>
  <g transform="translate(0,30)">
    <rect x="0" y="0" width="380" height="38" rx="8" fill="#111a2f" stroke="#1e3a5f" stroke-width="1" opacity="0.9"/>
    <text x="12" y="24" font-family="monospace" font-size="15" font-weight="600">
      <tspan fill="#c084fc">from</tspan><tspan fill="#e0e7ff"> </tspan><tspan fill="#5eead4">dna_tools</tspan><tspan fill="#e0e7ff"> </tspan><tspan fill="#c084fc">import</tspan><tspan fill="#e0e7ff"> </tspan><tspan fill="#86efac">CRISPR</tspan>
    </text>
  </g>
</g>
<g transform="translate(1020,180)" filter="url(#glow)">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    <path d="M -50,-90 Q 0,-45 50,0 Q 0,45 -50,90" fill="none" stroke="#5eead4" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
    <path d="M 50,-90 Q 0,-45 -50,0 Q 0,45 50,90" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  </g>
</g>
</svg>
