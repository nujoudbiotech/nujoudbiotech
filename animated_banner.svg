<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="60%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- خلفية متموجة زي حقها -->
  <path d="M0,25 Q640,0 1280,25 L1280,295 Q640,320 0,295 Z" fill="url(#bg)"/>
  <path d="M0,25 Q640,0 1280,25 L1280,35 Q640,10 0,35 Z" fill="#0891b2" opacity="0.8"/>
  <path d="M0,295 Q640,320 1280,295 L1280,285 Q640,310 0,285 Z" fill="#0891b2" opacity="0.8"/>
  
  <!-- DNA icon متوهج -->
  <g transform="translate(140,160)" filter="url(#glow)">
    <g opacity="0.9">
      <path d="M -30 -90 Q 30 -60 -30 -30 Q 30 0 -30 30 Q 30 60 -30 90" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="0" to="16" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 30 -90 Q -30 -60 30 -30 Q -30 0 30 30 Q -30 60 30 90" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-dasharray="4 4">
        <animate attributeName="stroke-dashoffset" from="16" to="0" dur="2s" repeatCount="indefinite"/>
      </path>
      <circle cx="-30" cy="-90" r="4" fill="#38bdf8"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="-90" r="4" fill="#a78bfa"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
    </g>
  </g>
  
  <text x="300" y="150" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="white">Nujood</text>
  <text x="302" y="185" font-family="Inter, sans-serif" font-size="15" fill="#7dd3fc" letter-spacing="0.6">Bioinformatics | Python | Gene Data Science | Gene24 | Future Cell &amp; Gene Therapy</text>
</svg>


